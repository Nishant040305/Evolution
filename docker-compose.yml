version: '3.8'
services:
  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
    env_file:
      - ./client/.env
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
